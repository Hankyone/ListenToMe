name: Apply recording coordinator patch

on:
  push:
    branches:
      - fix/ptt-media-session

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply verified patch
        run: |
          git apply --check Scripts/recording-coordinator.patch
          git apply Scripts/recording-coordinator.patch
          rm Scripts/recording-coordinator.patch
          rm .github/workflows/apply-recording-coordinator-patch.yml

      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources/ListenToMe/Services/RecordingCoordinator.swift
          git add -u Scripts/recording-coordinator.patch
          git add -u .github/workflows/apply-recording-coordinator-patch.yml
          git commit -m "Wire media pause to recording take lifecycle"
          git push origin "HEAD:${GITHUB_REF_NAME}"
