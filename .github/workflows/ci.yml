name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          chmod +x Scripts/*.sh
          ./Scripts/select-ci-xcode.sh --system

      - name: Resolve packages
        run: xcrun swift package resolve

      - name: Guard dependency Swift tools versions
        run: python3 Scripts/check-dependency-swift-tools.py 6 2

      - name: Test
        run: ./Scripts/test.sh

      - name: Package (ad-hoc)
        run: ./Scripts/package-app.sh
