name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # PermissionFlow requires Swift tools 6.2+ (Xcode 26).
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
          swift --version

      - name: Resolve packages
        run: xcrun swift package resolve

      - name: Test
        run: ./Scripts/test.sh

      - name: Package (ad-hoc)
        run: ./Scripts/package-app.sh
