name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # PermissionFlow requires Swift tools 6.2+ (Xcode 26).
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
          swift --version

      - name: Read version from Info.plist
        id: version
        run: |
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Resources/Info.plist)"
          TAG="${GITHUB_REF_NAME}"
          EXPECTED="v${VERSION}"
          if [[ "$TAG" != "$EXPECTED" ]]; then
            echo "Tag $TAG does not match Info.plist version $EXPECTED"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "zip=ListenToMe-${VERSION}.zip" >> "$GITHUB_OUTPUT"
          echo "dmg=ListenToMe-${VERSION}.dmg" >> "$GITHUB_OUTPUT"

      - name: Install create-dmg
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
        run: brew install create-dmg

      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/developer_id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain

      - name: Write Sparkle private key
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          mkdir -p .secrets
          printf '%s\n' "$SPARKLE_PRIVATE_KEY" > .secrets/sparkle_eddsa_private.key
          chmod 600 .secrets/sparkle_eddsa_private.key

      - name: Build, notarize, and generate appcast
        env:
          CODESIGN_IDENTITY: "Developer ID Application: Anouar Mansour (K32684A887)"
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SPARKLE_PRIVATE_KEY_FILE: ${{ github.workspace }}/.secrets/sparkle_eddsa_private.key
        run: ./Scripts/release.sh

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          ZIP_NAME: ${{ steps.version.outputs.zip }}
          DMG_NAME: ${{ steps.version.outputs.dmg }}
        run: |
          NOTES="ListenToMe ${VERSION}"
          if [[ -f RELEASE_NOTES.md ]]; then
            NOTES="$(cat RELEASE_NOTES.md)"
          fi
          gh release create "$GITHUB_REF_NAME" \
            "release/${DMG_NAME}" \
            "release/${ZIP_NAME}" \
            "release/appcast.xml" \
            --title "ListenToMe ${VERSION}" \
            --notes "$NOTES"

      - name: Cleanup keychain and secrets
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true
          rm -rf .secrets
