<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="840" viewBox="0 0 1320 840">
  <defs>
    <linearGradient id="stage" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2F0ED"/>
      <stop offset="55%" stop-color="#E8E5E1"/>
      <stop offset="100%" stop-color="#DDD8D2"/>
    </linearGradient>
    <radialGradient id="wash" cx="50%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#D85F47" stop-opacity="0.08"/>
      <stop offset="60%" stop-color="#D85F47" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#D85F47" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Light stage so Finder's black icon labels stay readable -->
  <rect width="1320" height="840" fill="url(#stage)"/>
  <rect width="1320" height="840" fill="url(#wash)"/>

  <!-- Quiet brand mark — no fake icons in the chrome -->
  <text x="660" y="118" text-anchor="middle"
        font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="54" font-weight="600" letter-spacing="1.2"
        fill="#1D1A18">ListenToMe</text>
  <text x="660" y="168" text-anchor="middle"
        font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="22" font-weight="500" letter-spacing="0.3"
        fill="#6E675F">Drag the app into Applications</text>

  <!-- Arrow between the two Finder icons -->
  <g transform="translate(660 390)" fill="none" stroke="#D85F47" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <path d="M -70 0 H 54"/>
    <path d="M 30 -22 L 70 0 L 30 22"/>
  </g>
</svg>
