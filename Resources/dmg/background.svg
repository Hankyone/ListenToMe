<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="840" viewBox="0 0 1320 840">
  <defs>
    <linearGradient id="stage" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1714"/>
      <stop offset="45%" stop-color="#141210"/>
      <stop offset="100%" stop-color="#0E0C0B"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#D85F47" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#D85F47" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#D85F47" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E07A62" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#D85F47" stop-opacity="0.18"/>
    </linearGradient>
  </defs>

  <rect width="1320" height="840" fill="url(#stage)"/>
  <rect width="1320" height="840" fill="url(#glow)"/>

  <!-- Soft floor line under the icons -->
  <rect x="120" y="560" width="1080" height="1" fill="#F5EFE6" opacity="0.06"/>

  <!-- Decorative waveform, kept low so icons stay clear -->
  <g transform="translate(0 668)" fill="url(#bar)">
    <rect x="180" y="28" width="14" height="36" rx="7"/>
    <rect x="206" y="16" width="14" height="60" rx="7"/>
    <rect x="232" y="4" width="14" height="84" rx="7"/>
    <rect x="258" y="20" width="14" height="52" rx="7"/>
    <rect x="284" y="28" width="14" height="36" rx="7"/>
    <rect x="310" y="12" width="14" height="68" rx="7"/>
    <rect x="336" y="24" width="14" height="44" rx="7"/>

    <rect x="980" y="28" width="14" height="36" rx="7"/>
    <rect x="1006" y="16" width="14" height="60" rx="7"/>
    <rect x="1032" y="4" width="14" height="84" rx="7"/>
    <rect x="1058" y="20" width="14" height="52" rx="7"/>
    <rect x="1084" y="28" width="14" height="36" rx="7"/>
    <rect x="1110" y="12" width="14" height="68" rx="7"/>
    <rect x="1136" y="24" width="14" height="44" rx="7"/>
  </g>

  <!-- Brand -->
  <text x="660" y="118" text-anchor="middle"
        font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="54" font-weight="600" letter-spacing="1.5"
        fill="#F5EFE6">ListenToMe</text>
  <text x="660" y="168" text-anchor="middle"
        font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="22" font-weight="500" letter-spacing="0.4"
        fill="#B0A598">Drag the app into Applications</text>

  <!-- Arrow between icon slots -->
  <g transform="translate(660 390)" fill="none" stroke="#D85F47" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <path d="M -70 0 H 54"/>
    <path d="M 30 -22 L 70 0 L 30 22"/>
  </g>
</svg>
